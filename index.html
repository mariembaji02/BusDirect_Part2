<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BusDirect-tickets</title>
    <!-- link of style sheet  -->
    <link rel="stylesheet" href="style.css">
    <!-- link of tailwind css -->
      <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
      <!-- font awsome link -->
       <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
       <link rel="shortcut icon" href="images/icon2.svg" type="image/x-icon">
       
</head>
<body  class="min-h-screen flex flex-col">

      <header class=" flex  justify-around  shadow-sm  ">
    <div class="   m-3 flex  text-3xl  lg:w-1/3 md:justify-start md:m-5 "><img src="images/icon2.svg" class="logo ml-4"><h1 class="mt-2">Bus<span class="text-[rgb(89,198,185)]">Direct</span></h1></div>
    <!-- Navigation -->
     <nav class="text-lg w-full flex justify-end m-6  gap-20 md:w-1/2 ">
            <a href="index.html" class="text-lg border-b-4  border-yellow-500/80 rounded-md">Trajets</a>
            <i class="fa-solid fa-circle-user text-4xl mr-4" style="color: rgb(37, 174, 158);"></i>
     </nav>
  </header>
  <head>
    <section class="section-Head flex justify-center fo p-4  mx-4 bg-teal-200/20  ">
    <div class="trajet lg:m-2 text-center" >
        
        <h1 class="text-3xl font-semibold  lg:text-4xl" style="color: rgba(190, 161, 20, 0.735);">BusDirect</h1>
          <div>
                <h3 class="text-sm text-gray-600 md:text-lg ">Tous les trajets</h3>
                <h4 class=" text-gray-400 text-xs md:text-sm"> Gérez les réservations de tout le réseau BusDirect</h4>
          </div></div>
   
  </section>
  </head>
   <main class="w-full  flex flex-col gap-3 justify-center mt-5 flex-1">
          <section class="section-Infos flex flex-col  h-60 md:h-30 justify-between md:flex-row mt-4 mx-4 lg:" >
        <div class="static  p-3 flex gap-10 justify-center items-center rounded-2xl   h-20 md:w-[30%] " ><img src="images/trajet.svg" alt="trajets" class="w-8"><p class="flex flex-col"><span>20 </span> <span class="text-gray-500">trajet</span></p></div>
        <div class="static  p-3 flex gap-10 justify-center items-center rounded-2xl  h-20 md:w-[30%] " ><img src="images/people.svg" alt="users" class="w-8"><p class="flex flex-col"><span class="totalPassager "> </span><span class="text-gray-500">passager </span> </p></div>
        <div class="static  p-3 flex gap-10 justify-center items-center rounded-2xl  h-20 md:w-[30%]  " ><img src="images/recette.svg" alt="recette" class="w-8"  ><p class="flex flex-col"><span><span id="recette"></span> DH</span><span class="text-gray-500">recette totale</span></p></div>
    </section>
    <section class="panel  mb-4 mx-4 ">
      <form class="form flex gap-10 p-5  rounded-lg border border-gray-300 bg-[#fff] " id="form">
        <div class="flex flex-col w-[100%] relative"><label for="q">Ville</label><input id="cherche" placeholder="Ex: Marrakech" class="border border-[lightgrey] p-4 rounded-xl"> 
        <i class="fa-solid fa-magnifying-glass"  style="color: rgba(154, 153, 149, 0.731);font-size: 25px;position: absolute;right:5%;top: 50%;"></i></div>
        <div class="flex flex-col w-[70%]"><label for="s">Statut</label><select id="filter" class="border border-[lightgrey] p-4 rounded-xl"><option value="allStatuts">Tous les statuts</option><option value="Disponible">Disponible</option><option value="Complet">Complet</option></select></div>
      </form>
    </section>
       <span class="message w-full text-gray-800 hidden text-xl text-center">Aucun trajet ne correspond...</span>

      
       <div class="gridTrajets grid grid-cols-3 w-full gap-3 p-5 " id="grid">
      </div>
      



       <nav class="pagination flex w-full  p-3 justify-center gap-20" id="pager" aria-label="Pagination">
        
       </nav>

       </main>
        <!-- Pied de page -->
        <footer class="bg-black text-center h-20 pt-4 mt-4 " >
          <p class="text-white ">© 2026 BusDirect - Gestion des réservations</p>
        </footer>    
    <script type="module" src="js/main-trajets.js"></script>
</body>
</html>
